[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumicycle"
version = "0.1.0"
description = "Bidirectional unpaired day-night image translation for BDD100K"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10.4",
  "PyYAML>=6.0.2",
  "tqdm>=4.66",
  "tensorboard>=2.17",
  "torchmetrics[image]>=1.6",
  "torch-fidelity>=0.3",
  "gradio>=5.35,<7",
  "imagehash>=4.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]
detector = ["ultralytics>=8.3"]
turbo = ["diffusers>=0.33", "transformers>=4.48", "accelerate>=1.3", "safetensors>=0.5"]
teachers = ["transformers>=4.48", "accelerate>=1.3", "safetensors>=0.5"]
datasets = ["kagglehub==1.0.2"]

[tool.setuptools.packages.find]
include = ["daynight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
